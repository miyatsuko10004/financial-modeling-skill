name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Audit Template Model
      run: |
        python3 scripts/check_model.py templates/single_sheet_3statement_template.xlsx

    - name: Generate and Audit Fresh Model
      run: |
        python3 scripts/new_model.py --type single --title "CI Test Automated Model" -o /tmp/ci_test_model.xlsx
        python3 scripts/check_model.py /tmp/ci_test_model.xlsx

    - name: Verify Multiple Patterns (IBD, Keyence, SaaS, Retail)
      run: |
        python3 scripts/verify_multiple_patterns.py

